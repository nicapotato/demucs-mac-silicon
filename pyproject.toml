[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demucs-mac-silicon"
dynamic = ["version"]
description = "Apple Silicon Demucs workers (Python wrapper over demucs-mlx, and a C/mlx-c worker)."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "nicapotato"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  # Upstream is pinned EXACTLY. Bump it deliberately via docs/upgrading.md
  # (or the scheduled upstream-watch workflow), never with a loose range.
  "demucs-mlx==1.6.1",
  "numpy",
  "safetensors",
  "tqdm",
  "lameenc",
]

[project.optional-dependencies]
dev = [
  "build",
  "pyright",
  "pytest",
  "ruff",
]

freeze = [
  "pyinstaller",
]

convert = [
  "demucs-mlx[convert]==1.6.1",
]

[project.scripts]
demucs-mlx-worker = "worker_py.cli:main"

[project.urls]
Homepage = "https://github.com/nicapotato/demucs-mac-silicon"
Upstream = "https://github.com/ssmall256/demucs-mlx"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["worker_py", "tests", "scripts"]
exclude = ["**/__pycache__", "**/.venv", "dist", "worker-c/build", "out", "models", "goldens"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportOptionalSubscript = false
reportOptionalOperand = false
reportOptionalMemberAccess = false
reportOptionalIterable = false
reportArgumentType = false
reportAttributeAccessIssue = false
reportIndexIssue = false
reportCallIssue = false
reportRedeclaration = false
reportPrivateImportUsage = false
reportOperatorIssue = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: needs converted htdemucs_6s weights (skipped when absent)",
  "c_worker: needs a built worker-c binary (skipped when absent)",
]

[tool.ruff]
line-length = 100
exclude = []

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "worker_py.__version__"}

[tool.setuptools.packages.find]
include = ["worker_py*"]
