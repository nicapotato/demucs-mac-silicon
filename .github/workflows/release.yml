name: release

# Tags v$VERSION (project.conf) and publishes:
#   - demucs-mlx-worker-py-mac-arm64-vX.Y.Z.zip   frozen worker_py (PyInstaller onedir)
#   - demucs-mlx-worker-c-mac-arm64-vX.Y.Z.zip    C worker + mlx.metallib
#   - htdemucs_6s.safetensors + htdemucs_6s_config.json   upstream-format weights (offline bundle)
#   - htdemucs_6s.c.safetensors + htdemucs_6s.json        C-worker export (same tensors, no model_0. prefix)
#   - export_manifest.json                        pinned upstream version, hashes, mlx/mlx-c pairing
# The gate (`make verify`, via ci.yml) must pass first.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (leave empty to use project.conf)"
        required: false
        default: ""
        type: string
      publish_gh_release:
        description: "Create git tag + GitHub Release assets"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  GH_TOKEN: ${{ github.token }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

jobs:
  read-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      upstream: ${{ steps.v.outputs.upstream }}
    steps:
      - name: Block re-runs
        if: github.run_attempt != 1
        shell: bash
        run: |
          echo "::error::Re-runs are disabled (attempt ${{ github.run_attempt }}). Dispatch a new run instead." >&2
          exit 1

      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            V="${INPUT_VERSION}"
          else
            V=$(grep '^VERSION=' project.conf | cut -d= -f2 | tr -d '[:space:]')
          fi
          if [ -z "$V" ]; then
            echo "ERROR: empty VERSION" >&2
            exit 1
          fi
          UP=$(sed -nE 's/.*"demucs-mlx==([^"]+)".*/\1/p' pyproject.toml | head -1)
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UP}" >> "$GITHUB_OUTPUT"
          echo "Version: ${V} (tag v${V}); upstream demucs-mlx ${UP}"

  verify:
    needs: read-version
    uses: ./.github/workflows/ci.yml

  package:
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [read-version, verify]
    env:
      VERSION: ${{ needs.read-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --extra dev --extra freeze

      - name: Install native deps (lame, mpg123)
        run: make native-deps

      - name: Restore upstream weights cache
        uses: actions/cache@v4
        with:
          path: models/mlx-cache
          key: mlx-weights-${{ hashFiles('models/export_manifest.json') }}

      - name: Fetch weights and re-check the C export contract
        run: |
          set -euo pipefail
          make models-check models-export
          test -f models/mlx-cache/htdemucs_6s.safetensors
          test -f models/htdemucs_6s.safetensors
          test -f models/htdemucs_6s.json
          # Upstream cache and C-export must match the committed manifest (parity gate).
          WANT=$(python3 -c "import json;print(json.load(open('models/export_manifest.json'))['source_cache_sha256'])")
          GOT=$(shasum -a 256 models/mlx-cache/htdemucs_6s.safetensors | cut -d' ' -f1)
          test "$WANT" = "$GOT" || { echo "upstream weights sha256 ${GOT} != manifest ${WANT}" >&2; exit 1; }
          WANT=$(python3 -c "import json;print(json.load(open('models/export_manifest.json'))['export']['safetensors_sha256'])")
          GOT=$(shasum -a 256 models/htdemucs_6s.safetensors | cut -d' ' -f1)
          test "$WANT" = "$GOT" || { echo "C-export sha256 ${GOT} != manifest ${WANT}" >&2; exit 1; }

      - name: Build the C worker and the frozen worker_py
        run: |
          set -euo pipefail
          make worker                  # C worker + mlx.metallib -> dist/worker
          make worker-py-verify-build  # frozen worker_py        -> dist/worker-py
          test -x dist/worker/demucs_mlx_worker
          test -x dist/worker-py/demucs_mlx_worker/demucs_mlx_worker

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets c-stage
          cp dist/worker/demucs_mlx_worker dist/worker/mlx.metallib c-stage/
          ditto -c -k --keepParent dist/worker-py/demucs_mlx_worker \
            "release-assets/demucs-mlx-worker-py-mac-arm64-v${VERSION}.zip"
          ditto -c -k --keepParent c-stage \
            "release-assets/demucs-mlx-worker-c-mac-arm64-v${VERSION}.zip"
          cp models/mlx-cache/htdemucs_6s.safetensors release-assets/
          cp models/mlx-cache/htdemucs_6s_config.json release-assets/
          # Distinct name: same stem as the upstream file, different tensor keys.
          cp models/htdemucs_6s.safetensors release-assets/htdemucs_6s.c.safetensors
          cp models/htdemucs_6s.json release-assets/
          cp models/export_manifest.json release-assets/
          (
            cd release-assets
            shasum -a 256 * | tee SHA256SUMS
          )
          ls -la release-assets/
          for f in htdemucs_6s.safetensors htdemucs_6s.c.safetensors; do
            BYTES=$(stat -f%z "release-assets/${f}")
            test "$BYTES" -gt 1000000
            test "$BYTES" -lt 2147483648
          done
          test -f release-assets/htdemucs_6s.json

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: demucs-mlx-worker-mac-arm64-release
          path: release-assets/*
          if-no-files-found: error

  publish-gh-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [read-version, package]
    if: github.event.inputs.publish_gh_release == 'true'
    env:
      TAG: ${{ needs.read-version.outputs.tag }}
      VERSION: ${{ needs.read-version.outputs.version }}
      UPSTREAM: ${{ needs.read-version.outputs.upstream }}
    steps:
      - name: Block re-runs
        if: github.run_attempt != 1
        shell: bash
        run: |
          echo "::error::Re-runs are disabled (attempt ${{ github.run_attempt }}). Dispatch a new run instead." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard duplicate worker tag
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${TAG} already exists; bump VERSION in project.conf" >&2
            exit 1
          fi
          echo "Tag ${TAG} is available"

      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          name: demucs-mlx-worker-mac-arm64-release
          path: release-assets

      - name: Release notes
        run: |
          set -euo pipefail
          python3 - <<'PY' > release-notes.md
          import json, os
          m = json.load(open("release-assets/export_manifest.json"))
          print("Workers for [demucs-ui-app](https://github.com/nicapotato/demucs-ui-app).")
          print()
          print("## Pinned upstream")
          print(f"- demucs-mlx **{m['upstream']['version']}** (mlx {m['mlx_python']}, "
                f"mlx-c {m['mlx_c']['tag']} embedding mlx {m['mlx_c']['embedded_mlx']})")
          print(f"- weights sha256 `{m['source_cache_sha256']}`")
          print(f"- worker-c export: {m['export']['num_tensors']} tensors, "
                f"sha256 `{m['export']['safetensors_sha256']}`")
          print()
          print("## Assets")
          print("- `demucs-mlx-worker-py-mac-arm64-*.zip`: frozen worker_py (PyInstaller onedir)")
          print("- `demucs-mlx-worker-c-mac-arm64-*.zip`: C worker + mlx.metallib")
          print("- `htdemucs_6s.safetensors`, `htdemucs_6s_config.json`: upstream-format weights "
                "(DEMUCS_MLX_CACHE_DIR layout, for the Python worker / offline bundles)")
          print("- `htdemucs_6s.c.safetensors`, `htdemucs_6s.json`: C-worker export "
                "(same tensors, no `model_0.` prefix; rename the safetensors to "
                "`htdemucs_6s.safetensors` next to the json)")
          print("- `export_manifest.json`, `SHA256SUMS`")
          PY

      - name: Create worker GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: demucs-mac-silicon ${{ env.TAG }} (demucs-mlx ${{ env.UPSTREAM }})
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            release-assets/*
