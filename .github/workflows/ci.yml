name: ci

# Runs the same gate you run locally: `make verify`
# (lint, upstream-drift check, C worker build + unit tests, frozen-worker build,
#  py vs c vs frozen parity, GUI JSON-event contract).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (leave empty to use project.conf)"
        required: false
        default: ""
        type: string
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  GH_TOKEN: ${{ github.token }}

jobs:
  static:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --extra dev --extra freeze

      - name: Lint, type check, tests that need no weights
        run: make test-fast

  verify:
    runs-on: macos-latest
    timeout-minutes: 60
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --extra dev --extra freeze

      # Upstream weights (~105 MB, digest-checked by demucs-mlx). Keyed on the recorded
      # source hash, so a weights change in an upstream bump busts the cache.
      - name: Restore upstream weights cache
        uses: actions/cache@v4
        with:
          path: models/mlx-cache
          key: mlx-weights-${{ hashFiles('models/export_manifest.json') }}

      - name: make verify
        run: make verify

      - name: Frozen worker smoke (offline, GUI flags)
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke
          uv run python - <<'PY'
          import numpy as np
          from worker_py.c_export import write_wav_pcm16
          t = np.arange(44100 * 6) / 44100
          a = (0.3 * np.sin(2 * np.pi * 220 * t)).astype(np.float32)
          write_wav_pcm16("/tmp/smoke/in.wav", np.stack([a, a]), 44100)
          PY
          DEMUCS_MLX_CACHE_DIR="$(pwd)/models/mlx-cache" \
            dist/worker-py/demucs_mlx_worker/demucs_mlx_worker \
            /tmp/smoke/in.wav -o /tmp/smoke/out --track-name in --progress-json \
            --prefetch-tracks 0 --offline --mp3 | tee /tmp/smoke/events.log
          grep -q '"event": "done"' /tmp/smoke/events.log
          test -f /tmp/smoke/out/in/vocals.mp3

      - name: Package workers
        if: always()
        run: |
          mkdir -p ci-artifacts
          [ -d dist/worker-py/demucs_mlx_worker ] && \
            ditto -c -k --keepParent dist/worker-py/demucs_mlx_worker ci-artifacts/demucs-mlx-worker-py-mac-arm64.zip || true
          [ -x worker-c/build/demucs_mlx_worker ] && cp worker-c/build/demucs_mlx_worker ci-artifacts/demucs_mlx_worker_c || true
          cp models/export_manifest.json ci-artifacts/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demucs-mac-silicon-ci
          path: ci-artifacts/*
          if-no-files-found: warn
          retention-days: 30
